name: boxing_timer_flutter
description: "Professional Boxing & Interval Timer App"
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.5
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

# App launcher icon generation (run: dart run flutter_launcher_icons).
# Adaptive (round-maskable) icon so it matches the circular system icons.
# The source art is full-bleed, and adaptive icons only show the center ~66%
# of the layer, so the clock (top-right) and glove tips get cropped — an
# accepted trade-off for the consistent round shape. image_path still
# generates a legacy square icon for pre-API-26 devices. Both adaptive layers
# use the full image (foreground is opaque and full-bleed, so it fills the
# masked area; background is a fallback only visible if a launcher insets).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
